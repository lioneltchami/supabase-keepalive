name: Supabase keepalive

on:
  schedule:
    # Four database reads per day; avoid the top of the hour, when Actions is busiest.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    # Keep scheduled runs idle until project setup is complete; manual runs remain available for testing.
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_KEEPALIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out keepalive script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Ping configured Supabase projects
        env:
          SUPABASE_KEEPALIVE_PROJECTS_JSON: ${{ secrets.SUPABASE_KEEPALIVE_PROJECTS_JSON }}
        run: node scripts/supabase-keepalive.mjs
